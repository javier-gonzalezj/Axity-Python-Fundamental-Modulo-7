repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff (lint)
        entry: poetry run ruff check --fix
        language: system
        types_or: [python, pyi]

      - id: ruff-format
        name: ruff (formato)
        entry: poetry run ruff format
        language: system
        types_or: [python, pyi]

      - id: mypy
        name: mypy (tipos)
        entry: poetry run mypy
        language: system
        types: [python]
        pass_filenames: false